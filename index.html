<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumia | Украшения с душой</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #faf8fc; --surface-solid: #ffffff; --text: #1a1220; --text-dim: #71667a; 
    --accent: #9d4edd; --pink: #ff7eb3; --border: rgba(157, 78, 221, 0.12); 
    --radius: 24px; --shadow-sm: 0 4px 12px rgba(157, 78, 221, 0.08); 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
  h1, h2 { font-family: 'Manrope', sans-serif; text-align: center; }
  
  .container { max-width: 1200px; margin: 0 auto; }
  
  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; margin-top: 40px; }
  .product-card { background: var(--surface-solid); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; border: 1px solid var(--border); transition: 0.3s; }
  .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 24px rgba(157, 78, 221, 0.15); }
  .product-img-wrap { overflow: hidden; height: 320px; background: #f5f0f7; }
  .product-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
  .product-card:hover .product-img { transform: scale(1.05); }
  .product-info { padding: 24px; display: flex; flex-direction: column; flex: 1; }
  .product-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
  .product-price { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
  .sold-out-badge { background: #e11d48; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  
  .error-box { background: #fff1f2; border: 2px dashed #f43f5e; color: #be123c; padding: 24px; border-radius: 16px; margin-top: 20px; font-family: monospace; font-size: 14px; white-space: pre-wrap; }
  .loading { text-align: center; font-size: 18px; color: var(--text-dim); margin-top: 40px; }
</style>
</head>
<body>

<div class="container">
  <h1>Тест каталога (Google Таблицы)</h1>
  
  <div id="debugBox" class="error-box" style="display:none;"></div>
  <div id="catalogGrid" class="catalog-grid">
    <div class="loading" style="grid-column: 1/-1;">Загрузка товаров...</div>
  </div>
</div>

<script>
  // Твоя ссылка
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKyqrzk1YSp8N2qk90zEJFLL7I3EZPgdDOcRzJibwWgriJfgkNdF4iGZcF0zVaLmR6YC6k1TTuH1xo/pub?output=csv'; 

  function showError(msg) {
    document.getElementById('catalogGrid').innerHTML = '';
    const box = document.getElementById('debugBox');
    box.style.display = 'block';
    box.innerText = '⚠️ ' + msg;
  }

  // Парсер CSV
  function parseCSV(text) {
    const result = [];
    let row = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];
      
      if (char === '"') {
        if (inQuotes && nextChar === '"') { current += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (char === ',' && !inQuotes) {
        row.push(current); current = '';
      } else if ((char === '\n' || char === '\r') && !inQuotes) {
        if (current !== '' || row.length > 0) {
          row.push(current); result.push(row); row = []; current = '';
        }
        if (char === '\r' && nextChar === '\n') i++;
      } else {
        current += char;
      }
    }
    if (current !== '' || row.length > 0) { row.push(current); result.push(row); }
    return result;
  }

  async function loadCatalog() {
    try {
      const url = SHEET_CSV_URL + '&t=' + Date.now();
      const response = await fetch(url);
      
      if (!response.ok) throw new Error('Ошибка сети');
      const text = await response.text();

      if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
        showError('Вместо данных скачалась HTML-страница. Проверь ссылку.');
        return;
      }

      const rows = parseCSV(text);
      
      // Если в таблице меньше 2 строк (только заголовки)
      if (rows.length < 2) {
        showError('В таблице нет товаров. Добавь данные со второй строки.');
        return;
      }

      // Берем все строки, кроме первой (заголовков)
      const dataRows = rows.slice(1);

      // Обрабатываем строки
      const products = dataRows.map((cols, index) => {
        const title = cols[0] ? cols[0].trim() : '';
        if (!title) return null; // Пропускаем пустые строки

        // Очищаем цену от всего, кроме цифр
        const priceStr = cols[1] ? cols[1].trim() : '0';
        const price = Number(priceStr.replace(/[^\d]/g, '')) || 0;

        return {
          id: index,
          title: title,
          price: price,
          img: cols[2] ? cols[2].trim() : '',
          sold: cols[3] ? ['да', 'yes', 'true', '1'].includes(cols[3].trim().toLowerCase()) : false
        };
      }).filter(p => p !== null);

      if (products.length === 0) {
        showError('Данные есть, но они не распознались. Проверь, что Название в столбце A, Цена в B.');
        return;
      }

      // Рисуем
      document.getElementById('debugBox').style.display = 'none';
      document.getElementById('catalogGrid').innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-img-wrap">
            ${p.img ? `<img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/300?text=Ошибка+фото'">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">Нет фото</div>`}
          </div>
          <div class="product-info">
            ${p.sold ? '<div class="sold-out-badge">Продано</div>' : ''}
            <div class="product-title">${p.title}</div>
            <div class="product-price">${p.price.toLocaleString()} ₽</div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      showError('Ошибка: ' + err.message);
    }
  }

  loadCatalog();
</script>
</body>
</html>
