<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumia | Каталог</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #faf8fc; --surface-solid: #ffffff; --text: #1a1220; --text-dim: #71667a; --accent: #9d4edd; --border: rgba(157, 78, 221, 0.12); --radius: 24px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
  h1, h2 { font-family: 'Manrope', sans-serif; text-align: center; }
  .container { max-width: 1200px; margin: 0 auto; }
  
  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; margin-top: 40px; }
  .product-card { background: var(--surface-solid); border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 12px rgba(157, 78, 221, 0.08); display: flex; flex-direction: column; border: 1px solid var(--border); }
  .product-img-wrap { overflow: hidden; height: 320px; background: #f5f0f7; }
  .product-img { width: 100%; height: 100%; object-fit: cover; }
  .product-info { padding: 24px; display: flex; flex-direction: column; flex: 1; }
  .product-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .product-price { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
  .sold-out-badge { background: #e11d48; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 12px; text-transform: uppercase; }
  
  .error-box { background: #fff1f2; border: 2px dashed #f43f5e; color: #be123c; padding: 24px; border-radius: 16px; margin-top: 20px; font-family: monospace; font-size: 14px; white-space: pre-wrap; }
  .loading { text-align: center; font-size: 18px; color: var(--text-dim); margin-top: 40px; }
</style>
</head>
<body>

<div class="container">
  <h1>Каталог товаров</h1>
  
  <div id="errorPanel" class="error-box" style="display:none;"></div>
  <div id="productsContainer" class="catalog-grid">
    <div class="loading" style="grid-column: 1/-1;">Загрузка товаров...</div>
  </div>
</div>

<script>
  // Твоя ссылка
  const TABLE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKyqrzk1YSp8N2qk90zEJFLL7I3EZPgdDOcRzJibwWgriJfgkNdF4iGZcF0zVaLmR6YC6k1TTuH1xo/pub?output=csv'; 

  function displayError(message) {
    document.getElementById('productsContainer').innerHTML = '';
    const panel = document.getElementById('errorPanel');
    panel.style.display = 'block';
    panel.innerText = '⚠️ ' + message;
  }

  // Парсер CSV
  function parseCSV(text) {
    const result = [];
    let row = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];
      
      if (char === '"') {
        if (inQuotes && nextChar === '"') { current += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (char === ',' && !inQuotes) {
        row.push(current); current = '';
      } else if ((char === '\n' || char === '\r') && !inQuotes) {
        if (current !== '' || row.length > 0) {
          row.push(current); result.push(row); row = []; current = '';
        }
        if (char === '\r' && nextChar === '\n') i++;
      } else {
        current += char;
      }
    }
    if (current !== '' || row.length > 0) { row.push(current); result.push(row); }
    return result;
  }

  async function initCatalog() {
    try {
      // Запрос к таблице
      const response = await fetch(TABLE_URL + '&t=' + Date.now());
      
      if (!response.ok) {
        displayError('Не удалось связаться с Google Таблицами. Код ошибки: ' + response.status);
        return;
      }

      const textData = await response.text();

      // Проверка, не скачалась ли HTML-страница вместо CSV
      if (textData.trim().startsWith('<!DOCTYPE') || textData.trim().startsWith('<html')) {
        displayError('Скачалась веб-страница вместо файла CSV. Убедись, что при публикации таблицы выбран формат "CSV".');
        return;
      }

      const parsedRows = parseCSV(textData);
      
      if (parsedRows.length < 2) {
        displayError('В таблице слишком мало данных. Нужна хотя бы 1 строка заголовков и 1 строка с товаром.');
        return;
      }

      // Пропускаем первую строку (заголовки)
      const productRows = parsedRows.slice(1);

      // Формируем массив объектов
      const finalProducts = productRows.map((cols, index) => {
        const name = cols[0] ? cols[0].trim() : '';
        if (!name) return null;

        const rawPrice = cols[1] ? cols[1].trim() : '0';
        const numericPrice = Number(rawPrice.replace(/[^\d]/g, '')) || 0;

        return {
          id: index,
          title: name,
          price: numericPrice,
          img: cols[2] ? cols[2].trim() : '',
          isSold: cols[3] ? ['да', 'yes', 'true', '1'].includes(cols[3].trim().toLowerCase()) : false
        };
      }).filter(item => item !== null);

      if (finalProducts.length === 0) {
        displayError('Строки есть, но названия товаров пустые. Проверь столбец A.');
        return;
      }

      // Отрисовка
      document.getElementById('errorPanel').style.display = 'none';
      document.getElementById('productsContainer').innerHTML = finalProducts.map(p => `
        <div class="product-card">
          <div class="product-img-wrap">
            ${p.img ? `<img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/300?text=Ошибка+фото'">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">Нет фото</div>`}
          </div>
          <div class="product-info">
            ${p.isSold ? '<div class="sold-out-badge">Продано</div>' : ''}
            <div class="product-title">${p.title}</div>
            <div class="product-price">${p.price.toLocaleString()} ₽</div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      displayError('Ошибка при загрузке: ' + err.message);
    }
  }

  // Запуск
  initCatalog();
</script>
</body>
</html>
