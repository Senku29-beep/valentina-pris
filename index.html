<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumia | Тест каталога</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #faf8fc; --surface-solid: #ffffff; --text: #1a1220; --text-dim: #71667a; --accent: #9d4edd; --pink: #ff7eb3; --pink-soft: #ffe5f1; --border: rgba(157, 78, 221, 0.12); --radius: 24px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
  h1, h2 { font-family: 'Manrope', sans-serif; }
  .container { max-width: 1200px; margin: 0 auto; }
  
  /* Стили для ошибки */
  .error-box { background: #fff1f2; border: 2px dashed #f43f5e; color: #be123c; padding: 24px; border-radius: 16px; margin-bottom: 30px; font-family: monospace; font-size: 14px; white-space: pre-wrap; }
  .error-box h3 { font-family: 'Inter', sans-serif; margin-bottom: 12px; font-size: 18px; }

  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; }
  .product-card { background: var(--surface-solid); border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 12px rgba(157, 78, 221, 0.08); display: flex; flex-direction: column; border: 1px solid var(--border); }
  .product-img-wrap { overflow: hidden; height: 320px; background: #f5f0f7; }
  .product-img { width: 100%; height: 100%; object-fit: cover; }
  .product-info { padding: 24px; display: flex; flex-direction: column; flex: 1; }
  .product-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .product-price { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
  .sold-out-badge { background: #e11d48; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
  <h1 style="margin-bottom: 20px;">Тест каталога</h1>
  
  <!-- Блок для вывода ошибок -->
  <div id="debugBox" class="error-box" style="display:none;">
    <h3>ОШИБКА ЗАГРУЗКИ:</h3>
    <div id="debugText"></div>
  </div>

  <div class="catalog-grid" id="catalogGrid">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">Загрузка...</div>
  </div>
</div>

<script>
  // =========================================================
  // 1. ВСТАВЬ СВОЮ ССЫЛКУ (Она должна заканчиваться на output=csv)
  // =========================================================
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKyqrzk1YSp8N2qk90zEJFLL7I3EZPgdDOcRzJibwWgriJfgkNdF4iGZcF0zVaLmR6YC6k1TTuH1xo/pub?output=csv'; 

  function showError(msg, debugData = '') {
    document.getElementById('catalogGrid').innerHTML = '';
    const box = document.getElementById('debugBox');
    box.style.display = 'block';
    document.getElementById('debugText').innerText = msg + '\n\n--- Ответ сервера (первые 200 символов) ---\n' + debugData;
  }

  function parseCSV(text) {
    const result = [];
    let row = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];
      
      if (char === '"') {
        if (inQuotes && nextChar === '"') { current += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (char === ',' && !inQuotes) {
        row.push(current); current = '';
      } else if ((char === '\n' || char === '\r') && !inQuotes) {
        if (current !== '' || row.length > 0) {
          row.push(current); result.push(row); row = []; current = '';
        }
        if (char === '\r' && nextChar === '\n') i++;
      } else {
        current += char;
      }
    }
    if (current !== '' || row.length > 0) { row.push(current); result.push(row); }
    return result;
  }

  async function loadCatalog() {
    if (SHEET_CSV_URL === 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKyqrzk1YSp8N2qk90zEJFLL7I3EZPgdDOcRzJibwWgriJfgkNdF4iGZcF0zVaLmR6YC6k1TTuH1xo/pub?output=csv') {
      showError('Ты не вставил ссылку на таблицу в код! Найди строку "const SHEET_CSV_URL" и вставь ссылку.');
      return;
    }

    try {
      // Добавляем &t= чтобы браузер не кэшировал
      const url = SHEET_CSV_URL.includes('?') ? SHEET_CSV_URL + '&t=' + Date.now() : SHEET_CSV_URL + '?t=' + Date.now();
      const response = await fetch(url);
      
      if (!response.ok) {
        showError(`Сервер вернул ошибку ${response.status}. Проверь ссылку.`);
        return;
      }

      const text = await response.text();

      // ПРОВЕРКА: Если пришел HTML (то есть мы скачали страницу, а не файл)
      if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
        showError('Вместо CSV-файла скачалась веб-страница! Скорее всего, ты скопировал не ту ссылку (без "output=csv") или выбрал "Веб-страница" вместо "CSV" при публикации.', text.substring(0, 200));
        return;
      }

      const rows = parseCSV(text);
      console.log("Распарсенные строки:", rows); // Смотрим в консоль, если что

      if (rows.length < 2) {
        showError('В таблице нет данных. Убедись, что первая строка — заголовки, а со второй идут товары.');
        return;
      }

      // Убираем заголовки (первую строку)
      const dataRows = rows.slice(1);

      const products = dataRows.map((cols, index) => {
        // Если строка пустая — пропускаем
        if (!cols[0] || cols[0].trim() === '') return null;
        
        return {
          id: index,
          title: cols[0] ? cols[0].trim() : 'Без названия',
          price: cols[1] ? Number(cols[1].replace(/[^\d]/g, '')) || 0 : 0, // Очищаем цену от букв
          img: cols[2] ? cols[2].trim() : '',
          sold: cols[3] ? ['да', 'yes', 'true', '1'].includes(cols[3].trim().toLowerCase()) : false
        };
      }).filter(p => p !== null);

      if (products.length === 0) {
        showError('Данные в таблице есть, но они не распознались. Проверь, что товары начинаются со 2-й строки, а не с 1-й.');
        return;
      }

      // Если всё ок, рисуем
      document.getElementById('debugBox').style.display = 'none';
      renderProducts(products);

    } catch (err) {
      showError('Ошибка сети. Проверь интернет или правильность ссылки (возможно, таблица закрыта на приватность).\n' + err.message);
    }
  }

  function renderProducts(products) {
    document.getElementById('catalogGrid').innerHTML = products.map(p => `
      <div class="product-card">
        <div class="product-img-wrap">
          ${p.img ? `<img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/300?text=Ошибка+фото'">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">Нет фото</div>`}
        </div>
        <div class="product-info">
          ${p.sold ? '<div class="sold-out-badge">ПРОДАНО</div>' : ''}
          <div class="product-title">${p.title}</div>
          <div class="product-price">${p.price.toLocaleString()} ₽</div>
        </div>
      </div>
    `).join('');
  }

  loadCatalog();
</script>
</body>
</html>
